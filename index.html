<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenosique AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marcador: cuando la cámara ve este dibujo, aparece lo que está dentro -->
    <a-marker preset="hiro">
     <a-sphere position="0 0.5 0" radius="0.5" color="#d2691e"></a-sphere>
<a-cone position="1 0.5 0" radius-bottom="0.4" height="1" color="#ffd700"></a-cone> 
<a-box position="0 0.5 0" color="#2e8b57"
       animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
</a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
